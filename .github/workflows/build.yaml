name: Start Workflow

on:
  schedule:
    - cron: '0 */24 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]
    
concurrency:
  group: profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install code counter
      run: sudo apt-get update && sudo apt-get install -y cloc

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run update script
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
      run: python main.py

    - name: Commit and push changes
      run: |
        git fetch origin main
        if [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; then
          echo "::notice::Skipping image from an outdated revision; main has newer changes."
          exit 0
        fi
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'actions@github.com'
        git add README.md out/fetch.png out/fetch.gif
        git diff --quiet && git diff --staged --quiet || git commit -m "Update README"
        if ! git push origin HEAD:main; then
          git fetch origin main
          if [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; then
            echo "::notice::Main changed during publishing; a newer run will update the image."
            exit 0
          fi
          exit 1
        fi
