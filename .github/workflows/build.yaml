name: Start Workflow

on:
  schedule:
    - cron: '0 */24 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]
    
concurrency:
  group: profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v3

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.4.4'

    - name: Install code counter
      run: sudo apt-get update && sudo apt-get install -y cloc

    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: Install canvas renderer
      run: bun run --bun playwright install --with-deps chromium

    - name: Check TypeScript and rendering
      run: bun run check && bun test app/

    - name: Collect and render profile
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
      run: bun run update

    - name: Commit and push changes
      run: |
        git fetch origin main
        if [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; then
          echo "::notice::Skipping image from an outdated revision; main has newer changes."
          exit 0
        fi
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'actions@github.com'
        git add README.md out/fetch.png out/fetch.gif
        git diff --quiet && git diff --staged --quiet || git commit -m "Update README"
        if ! git push origin HEAD:main; then
          git fetch origin main
          if [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; then
            echo "::notice::Main changed during publishing; a newer run will update the image."
            exit 0
          fi
          exit 1
        fi
